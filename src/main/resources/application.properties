spring.application.name=shopeeerpSys
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.shopeeerp.pojo

# Ozon API (optional, prefer env or database)
ozon.api.client-id=${OZON_CLIENT_ID:}
ozon.api.api-key=${OZON_API_KEY:}

# Crypto secret
app.crypto.secret-key=${APP_CRYPTO_SECRET_KEY:change-me-please-change-me-32chars}

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-please-change-me-32chars}
app.jwt.access-token-minutes=120
app.jwt.refresh-token-hours=168

# Redis (cache)
app.redis.enabled=${APP_REDIS_ENABLED:true}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DB:0}
spring.redis.timeout=${REDIS_TIMEOUT_MS:2000}

# Cache: purchase price
app.cache.purchase-price.ttl-minutes=${PURCHASE_PRICE_TTL_MINUTES:10}
app.cache.purchase-price.null-ttl-minutes=${PURCHASE_PRICE_NULL_TTL_MINUTES:2}
app.cache.purchase-price.jitter-seconds=${PURCHASE_PRICE_JITTER_SECONDS:60}

# Password migration
app.password-migration.enabled=false
app.password-migration.exit-after-run=true

# Ozon HTTP client timeout/retry settings (ms)
ozon.http.connect-timeout-ms=5000
ozon.http.read-timeout-ms=20000
ozon.http.max-retries=2
ozon.http.retry-backoff-ms=1000
ozon.http.detail-max-retries=2
ozon.http.detail-retry-backoff-ms=1000

# Market scrape task settings
market.scrape.retry-delay-minutes=5

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:dev}

# Monitor
app.monitor.slow-ms=500
app.mybatis.slow-ms=300
