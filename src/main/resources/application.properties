spring.application.name=shopeeerpSys

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.shopeeerp.pojo

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopeeerp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
spring.datasource.username=root
spring.datasource.password=su123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# Ozon API (optional, prefer env or database)
ozon.api.client-id=${OZON_CLIENT_ID:}
ozon.api.api-key=${OZON_API_KEY:}

# Crypto secret
app.crypto.secret-key=${APP_CRYPTO_SECRET_KEY:change-me-please-change-me-32chars}

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-please-change-me-32chars}
app.jwt.access-token-minutes=120
app.jwt.refresh-token-hours=168

# Password migration
app.password-migration.enabled=false
app.password-migration.exit-after-run=true

# Ozon HTTP client timeout/retry settings (ms)
ozon.http.connect-timeout-ms=5000
ozon.http.read-timeout-ms=20000
ozon.http.max-retries=2
ozon.http.retry-backoff-ms=1000
ozon.http.detail-max-retries=2
ozon.http.detail-retry-backoff-ms=1000

# Market scrape task settings
market.scrape.retry-delay-minutes=5
