spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopeeerp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:su123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

app.log.path=logs/dev
# Redis (cache)
app.redis.enabled=${APP_REDIS_ENABLED:true}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DB:0}
spring.redis.timeout=${REDIS_TIMEOUT_MS:2000}

# Cache: purchase price
app.cache.purchase-price.ttl-minutes=${PURCHASE_PRICE_TTL_MINUTES:10}
app.cache.purchase-price.null-ttl-minutes=${PURCHASE_PRICE_NULL_TTL_MINUTES:2}
app.cache.purchase-price.jitter-seconds=${PURCHASE_PRICE_JITTER_SECONDS:60}